﻿<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PNGToQuizlet - Flow + Prompt Builder</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --ink: #12223a;
      --muted: #4f6078;
      --line: #d6e0ee;
      --brand: #1d4ed8;
      --accent: #0f766e;
      --warn: #b45309;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, #dbeafe 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, #dcfce7 0%, transparent 35%),
        var(--bg);
    }
    .layout {
      width: min(1600px, 100vw - 16px);
      margin: 0 auto;
      padding: 8px;
      display: grid;
      grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr);
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(10, 40, 80, 0.08);
    }
    .panel { padding: 14px; }
    h1, h2, h3 { margin: 0; }
    h1 { font-size: 22px; }
    h2 { font-size: 16px; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }

    .tabs { display: flex; gap: 8px; margin: 12px 0; }
    .tab {
      border: 1px solid var(--line);
      background: #f8fbff;
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }

    .flow-wrap {
      overflow: auto;
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, #f8fbff, #ffffff);
      padding: 8px;
      min-height: 56vh;
      max-height: 72vh;
    }
    .flow-svg { width: 100%; height: 68vh; min-height: 520px; display: block; }
    .flow-svg text { font-size: 12px; fill: var(--ink); font-weight: 600; user-select: none; }
    .node { cursor: pointer; }
    .node rect { fill: #fff; stroke: #9fb5d4; stroke-width: 1.5; rx: 10; ry: 10; }
    .node .tag { font-size: 10px; fill: #3f5b82; font-weight: 700; }
    .node.active rect { stroke: var(--accent); stroke-width: 3; }
    .edge { stroke: #5f7ea8; stroke-width: 1.2; fill: none; }
    .edge-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
    .edge.active { stroke: #0f766e; stroke-width: 2.4; }
    .edge-label { font-size: 11px; fill: #1d4f91; font-weight: 700; }
    .edge-label-bg { fill: #ffffff; stroke: #bfd0ea; stroke-width: 1; rx: 6; ry: 6; }

    .stack { display: grid; gap: 12px; }
    label { font-size: 12px; color: var(--muted); font-weight: 700; display: block; margin-bottom: 6px; }
    textarea, input, select {
      width: 100%; border: 1px solid var(--line); border-radius: 10px;
      padding: 10px; font: inherit; color: var(--ink); background: #fff;
    }
    textarea { min-height: 96px; resize: vertical; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      border: 0; border-radius: 10px; padding: 10px 12px;
      font-weight: 700; cursor: pointer;
    }
    .primary { background: var(--brand); color: #fff; }
    .ghost { background: #eef4ff; color: #14335f; border: 1px solid #c2d4f1; }
    .danger { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }

    pre {
      margin: 0;
      white-space: pre-wrap;
      background: #0b1f38;
      color: #e6f0ff;
      border-radius: 10px;
      padding: 12px;
      max-height: 280px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
    }
    .chip {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #ecfeff;
      color: #0e7490;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #a5f3fc;
      margin-right: 6px;
      margin-top: 6px;
    }
    .small { font-size: 12px; color: var(--muted); }

    @media (max-width: 1220px) {
      .layout { grid-template-columns: 1fr; }
      .btns { grid-template-columns: 1fr; }
      .flow-svg { min-height: 480px; height: 62vh; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <section class="card panel">
      <h1>Flow Viewer + Prompt Builder (PNGToQuizlet)</h1>
      <p class="sub">Click node để xem chi tiết, thêm comment kỹ thuật, sau đó xuất prompt hoàn chỉnh cho AI.</p>

      <div class="tabs">
        <button class="tab active" data-flow="desktop">Desktop (Python/Tk)</button>
        <button class="tab" data-flow="mobile">Mobile (React Native)</button>
      </div>

      <div class="flow-wrap">
        <svg id="flowSvg" class="flow-svg" viewBox="0 0 1400 780" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div id="flowChips"></div>
    </section>

    <aside class="card panel stack">
      <div>
        <h2>Node Đang Chọn</h2>
        <div id="nodeMeta" class="small">Chưa chọn node.</div>
      </div>
      <div>
        <h2>Dây Đang Chọn</h2>
        <div id="edgeMeta" class="small">Chưa chọn dây.</div>
      </div>

      <div>
        <label for="nodeComment">Comment cho node này</label>
        <textarea id="nodeComment" placeholder="Ví dụ: Flow bị loop sai khi resume quiz..."></textarea>
      </div>

      <div>
        <label for="globalGoal">Mục tiêu sửa (global)</label>
        <textarea id="globalGoal" placeholder="Ví dụ: Tối ưu UX resume session và tránh mất progress khi thoát màn hình."></textarea>
      </div>

      <div>
        <label for="priority">Ưu tiên</label>
        <select id="priority">
          <option value="P1 - Critical">P1 - Critical</option>
          <option value="P2 - High" selected>P2 - High</option>
          <option value="P3 - Medium">P3 - Medium</option>
          <option value="P4 - Low">P4 - Low</option>
        </select>
      </div>
      <div>
        <label for="edgeLabel">Ghi chú dây (label)</label>
        <input id="edgeLabel" placeholder="Ví dụ: Resume session" />
      </div>
      <div class="btns">
        <div>
          <label for="arrowMode">Vị trí mũi tên</label>
          <select id="arrowMode">
            <option value="end">Cuối dây</option>
            <option value="start">Đầu dây</option>
            <option value="both">Hai đầu</option>
            <option value="none">Ẩn</option>
          </select>
        </div>
        <div>
          <label for="edgeBend">Độ cong dây</label>
          <input id="edgeBend" type="range" min="-120" max="120" step="5" value="45" />
        </div>
      </div>
      <div class="btns">
        <button class="ghost" id="btnReverseEdge">Đảo chiều dây</button>
        <button class="ghost" id="btnClearEdgeLabel">Xoá label dây</button>
      </div>

      <div class="btns">
        <button class="primary" id="btnBuild">Xuất Prompt</button>
        <button class="ghost" id="btnCopy">Copy Prompt</button>
      </div>
      <div class="btns">
        <button class="ghost" id="btnSaveLayout">Lưu layout</button>
        <button class="ghost" id="btnResetLayout">Reset layout</button>
      </div>
      <button class="danger" id="btnReset">Xoá toàn bộ comment</button>

      <div>
        <label>Prompt xuất ra</label>
        <pre id="promptOut">Prompt sẽ xuất hiện ở đây...</pre>
      </div>
    </aside>
  </div>

  <script>
    const FLOWS = {
      desktop: {
        title: "Desktop - Python/CustomTkinter",
        nodes: [
          { id: "d_home", x: 60, y: 80, w: 170, h: 70, label: "HomeFrame", tag: "entry", detail: "Màn hình chính: danh sách deck, vào scan, API key, study/quiz/deck detail." },
          { id: "d_api", x: 300, y: 40, w: 190, h: 70, label: "APIKeyDialog", tag: "config", detail: "Quản lý nhiều API keys, test key, active key set, lưu settings." },
          { id: "d_scan", x: 300, y: 160, w: 190, h: 70, label: "ScanFrame", tag: "create", detail: "Chọn folder ảnh, nhập deck name, bắt đầu scan." },
          { id: "d_assign", x: 560, y: 160, w: 220, h: 70, label: "ScanAssignDialog", tag: "pipeline", detail: "Gán ảnh cho key/batch, OCR+Gemini tạo card, background progress." },
          { id: "d_dedup", x: 840, y: 160, w: 220, h: 70, label: "QuestionDedupDialog", tag: "quality", detail: "Tìm câu trùng (threshold ~0.85), merge/giữ card." },
          { id: "d_deck", x: 300, y: 300, w: 190, h: 70, label: "DeckFrame", tag: "manage", detail: "Xem deck detail, reset progress, export Quizlet, mở study/quiz." },
          { id: "d_study", x: 560, y: 300, w: 190, h: 70, label: "StudyFrame", tag: "learn", detail: "Flashcard study, flip, chấm biết/chưa biết, undo, lưu trạng thái card." },
          { id: "d_quiz", x: 840, y: 300, w: 190, h: 70, label: "QuizFrame", tag: "test", detail: "Quiz single/multi-choice, save/resume quiz session, thống kê kết quả." },
          { id: "d_export", x: 560, y: 430, w: 220, h: 70, label: "ExportService", tag: "output", detail: "Export deck sang Quizlet TXT theo format đã chọn." }
        ],
        edges: [
          ["d_home", "d_api"],
          ["d_home", "d_scan"],
          ["d_scan", "d_assign"],
          ["d_assign", "d_dedup"],
          ["d_assign", "d_home"],
          ["d_home", "d_deck"],
          ["d_deck", "d_study"],
          ["d_deck", "d_quiz"],
          ["d_deck", "d_export"],
          ["d_study", "d_home"],
          ["d_quiz", "d_home"]
        ]
      },
      mobile: {
        title: "Mobile - React Native",
        nodes: [
          { id: "m_home", x: 70, y: 90, w: 190, h: 70, label: "HomeScreen", tag: "entry", detail: "Import decks.json, list deck, clear deck, check update GitHub release." },
          { id: "m_deck", x: 350, y: 90, w: 200, h: 70, label: "DeckDetailScreen", tag: "select", detail: "Xem stats + progress, reset progress, chọn Flashcard/Quiz." },
          { id: "m_flash", x: 670, y: 40, w: 220, h: 70, label: "FlashcardScreen", tag: "learn", detail: "Swipe trái/phải để chấm, flip card, undo, resume theo status card." },
          { id: "m_quiz", x: 670, y: 170, w: 220, h: 70, label: "QuizScreen", tag: "test", detail: "Single/multi answer, confirm/next, lưu session và resume quiz." },
          { id: "m_storage", x: 980, y: 90, w: 170, h: 70, label: "storage.js", tag: "persist", detail: "AsyncStorage cho decks và sessions (load/save/update/delete)." },
          { id: "m_update", x: 350, y: 250, w: 200, h: 70, label: "Update Flow", tag: "ops", detail: "Check latest release, tải APK, mở installer qua IntentLauncher." }
        ],
        edges: [
          ["m_home", "m_deck"],
          ["m_deck", "m_flash"],
          ["m_deck", "m_quiz"],
          ["m_flash", "m_storage"],
          ["m_quiz", "m_storage"],
          ["m_home", "m_storage"],
          ["m_home", "m_update"]
        ]
      }
    };

    const STORAGE_KEY = "pngtoquizlet_flow_comments_v2";
    const ui = {
      svg: document.getElementById("flowSvg"),
      tabs: [...document.querySelectorAll(".tab")],
      nodeMeta: document.getElementById("nodeMeta"),
      edgeMeta: document.getElementById("edgeMeta"),
      nodeComment: document.getElementById("nodeComment"),
      edgeLabel: document.getElementById("edgeLabel"),
      arrowMode: document.getElementById("arrowMode"),
      edgeBend: document.getElementById("edgeBend"),
      globalGoal: document.getElementById("globalGoal"),
      priority: document.getElementById("priority"),
      promptOut: document.getElementById("promptOut"),
      btnBuild: document.getElementById("btnBuild"),
      btnCopy: document.getElementById("btnCopy"),
      btnSaveLayout: document.getElementById("btnSaveLayout"),
      btnResetLayout: document.getElementById("btnResetLayout"),
      btnReverseEdge: document.getElementById("btnReverseEdge"),
      btnClearEdgeLabel: document.getElementById("btnClearEdgeLabel"),
      btnReset: document.getElementById("btnReset"),
      flowChips: document.getElementById("flowChips")
    };

    let state = {
      activeFlow: "desktop",
      activeNode: null,
      activeEdgeId: null,
      comments: {},
      globalGoal: "",
      priority: "P2 - High",
      layouts: {},
      edgeMeta: {}
    };
    const dragState = { active: false, nodeId: null, dx: 0, dy: 0, moved: false };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        state = { ...state, ...s };
      } catch (e) {}
      ui.globalGoal.value = state.globalGoal || "";
      ui.priority.value = state.priority || "P2 - High";
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function setFlow(flowKey) {
      state.activeFlow = flowKey;
      state.activeNode = null;
      state.activeEdgeId = null;
      ui.tabs.forEach(t => t.classList.toggle("active", t.dataset.flow === flowKey));
      renderFlow();
      updateNodePanel();
      updateEdgePanel();
    }

    function getFlowNodes(flowKey) {
      const flow = FLOWS[flowKey];
      const map = (state.layouts && state.layouts[flowKey]) || {};
      return flow.nodes.map(n => {
        const p = map[n.id];
        if (!p) return { ...n };
        return { ...n, x: p.x, y: p.y };
      });
    }

    function setNodePosition(flowKey, nodeId, x, y) {
      if (!state.layouts[flowKey]) state.layouts[flowKey] = {};
      state.layouts[flowKey][nodeId] = { x, y };
    }

    function clearFlowLayout(flowKey) {
      if (!state.layouts) state.layouts = {};
      delete state.layouts[flowKey];
    }

    function getFlowEdges(flowKey) {
      const base = FLOWS[flowKey].edges;
      const metaMap = (state.edgeMeta && state.edgeMeta[flowKey]) || {};
      return base.map(([from, to]) => {
        const id = `${from}->${to}`;
        const m = metaMap[id] || {};
        return {
          id,
          from: m.from || from,
          to: m.to || to,
          label: m.label || "",
          arrow: m.arrow || "end",
          bend: Number.isFinite(m.bend) ? m.bend : 45
        };
      });
    }

    function setEdgeMeta(flowKey, edgeId, patch) {
      if (!state.edgeMeta[flowKey]) state.edgeMeta[flowKey] = {};
      const prev = state.edgeMeta[flowKey][edgeId] || {};
      state.edgeMeta[flowKey][edgeId] = { ...prev, ...patch };
    }

    function getActiveEdgeObj() {
      return getFlowEdges(state.activeFlow).find(e => e.id === state.activeEdgeId) || null;
    }

    function toSvgPoint(evt) {
      const rect = ui.svg.getBoundingClientRect();
      const vb = ui.svg.viewBox.baseVal;
      return {
        x: ((evt.clientX - rect.left) * vb.width) / rect.width,
        y: ((evt.clientY - rect.top) * vb.height) / rect.height
      };
    }

    function renderFlow() {
      const flow = FLOWS[state.activeFlow];
      const nodes = getFlowNodes(state.activeFlow);
      const edges = getFlowEdges(state.activeFlow);
      ui.svg.innerHTML = `
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L7,3 z" fill="#6b86aa"></path>
          </marker>
        </defs>`;

      const byId = Object.fromEntries(nodes.map(n => [n.id, n]));

      edges.forEach((edge) => {
        const from = edge.from;
        const to = edge.to;
        const a = byId[from], b = byId[to];
        if (!a || !b) return;
        const x1 = a.x + a.w;
        const y1 = a.y + a.h / 2;
        const x2 = b.x;
        const y2 = b.y + b.h / 2;
        const c1 = x1 + edge.bend;
        const c2 = x2 - edge.bend;
        const d = `M ${x1} ${y1} C ${c1} ${y1}, ${c2} ${y2}, ${x2} ${y2}`;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", `edge ${state.activeEdgeId === edge.id ? "active" : ""}`);
        path.setAttribute("d", d);
        if (edge.arrow === "end" || edge.arrow === "both") path.setAttribute("marker-end", "url(#arrow)");
        if (edge.arrow === "start" || edge.arrow === "both") path.setAttribute("marker-start", "url(#arrow)");
        ui.svg.appendChild(path);

        const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
        hit.setAttribute("class", "edge-hit");
        hit.setAttribute("d", d);
        hit.addEventListener("click", () => {
          state.activeEdgeId = edge.id;
          state.activeNode = null;
          renderFlow();
          updateNodePanel();
          updateEdgePanel();
        });
        ui.svg.appendChild(hit);

        if (edge.label && edge.label.trim()) {
          const lx = (x1 + x2) / 2;
          const ly = (y1 + y2) / 2 - Math.sign(edge.bend || 1) * 22;
          const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          bg.setAttribute("class", "edge-label-bg");
          bg.setAttribute("x", lx - 54);
          bg.setAttribute("y", ly - 12);
          bg.setAttribute("width", 108);
          bg.setAttribute("height", 20);
          ui.svg.appendChild(bg);

          const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
          txt.setAttribute("class", "edge-label");
          txt.setAttribute("x", lx);
          txt.setAttribute("y", ly + 2);
          txt.setAttribute("text-anchor", "middle");
          txt.textContent = edge.label.slice(0, 24);
          ui.svg.appendChild(txt);
        }
      });

      nodes.forEach(node => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", `node ${state.activeNode === node.id ? "active" : ""}`);
        g.dataset.id = node.id;

        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", node.x);
        r.setAttribute("y", node.y);
        r.setAttribute("width", node.w);
        r.setAttribute("height", node.h);
        g.appendChild(r);

        const t1 = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t1.setAttribute("x", node.x + 12);
        t1.setAttribute("y", node.y + 28);
        t1.textContent = node.label;
        g.appendChild(t1);

        const t2 = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t2.setAttribute("x", node.x + 12);
        t2.setAttribute("y", node.y + 48);
        t2.setAttribute("class", "tag");
        t2.textContent = node.tag.toUpperCase();
        g.appendChild(t2);

        g.addEventListener("mousedown", (evt) => {
          evt.preventDefault();
          const p = toSvgPoint(evt);
          dragState.active = true;
          dragState.nodeId = node.id;
          dragState.dx = p.x - node.x;
          dragState.dy = p.y - node.y;
          dragState.moved = false;
        });

        g.addEventListener("click", () => {
          if (dragState.moved) return;
          state.activeNode = node.id;
          state.activeEdgeId = null;
          renderFlow();
          updateNodePanel();
          updateEdgePanel();
        });

        ui.svg.appendChild(g);
      });

      ui.flowChips.innerHTML = `<span class="chip">${flow.title}</span>`;
      nodes.forEach(n => {
        const c = state.comments[n.id];
        if (c && c.trim()) {
          ui.flowChips.innerHTML += `<span class="chip">Comment: ${n.label}</span>`;
        }
      });
    }

    function getActiveNodeObj() {
      const flow = FLOWS[state.activeFlow];
      return flow.nodes.find(n => n.id === state.activeNode) || null;
    }

    function updateNodePanel() {
      const node = getActiveNodeObj();
      if (!node) {
        ui.nodeMeta.textContent = "Chưa chọn node.";
        ui.nodeComment.value = "";
        ui.nodeComment.disabled = true;
        return;
      }
      ui.nodeMeta.innerHTML = `<b>${node.label}</b><br>${node.detail}`;
      ui.nodeComment.disabled = false;
      ui.nodeComment.value = state.comments[node.id] || "";
    }

    function updateEdgePanel() {
      const edge = getActiveEdgeObj();
      if (!edge) {
        ui.edgeMeta.textContent = "Chưa chọn dây.";
        ui.edgeLabel.value = "";
        ui.arrowMode.value = "end";
        ui.edgeBend.value = "45";
        ui.edgeLabel.disabled = true;
        ui.arrowMode.disabled = true;
        ui.edgeBend.disabled = true;
        ui.btnReverseEdge.disabled = true;
        ui.btnClearEdgeLabel.disabled = true;
        return;
      }
      ui.edgeMeta.innerHTML = `<b>${edge.from}</b> -> <b>${edge.to}</b>`;
      ui.edgeLabel.disabled = false;
      ui.arrowMode.disabled = false;
      ui.edgeBend.disabled = false;
      ui.btnReverseEdge.disabled = false;
      ui.btnClearEdgeLabel.disabled = false;
      ui.edgeLabel.value = edge.label || "";
      ui.arrowMode.value = edge.arrow || "end";
      ui.edgeBend.value = String(edge.bend ?? 45);
    }

    function buildPrompt() {
      const desktop = FLOWS.desktop.nodes;
      const mobile = FLOWS.mobile.nodes;
      const allEdges = {
        desktop: getFlowEdges("desktop"),
        mobile: getFlowEdges("mobile")
      };
      const nodeFileHints = {
        d_home: "app.py -> class HomeFrame",
        d_api: "app.py -> class APIKeyDialog",
        d_scan: "app.py -> class ScanFrame",
        d_assign: "app.py -> class ScanAssignDialog",
        d_dedup: "app.py -> class QuestionDedupDialog; services/dedup_service.py",
        d_deck: "app.py -> class DeckFrame",
        d_study: "app.py -> class StudyFrame",
        d_quiz: "app.py -> class QuizFrame; services/storage_service.py (quiz sessions)",
        d_export: "services/export_service.py",
        m_home: "androidApp/src/screens/HomeScreen.js",
        m_deck: "androidApp/src/screens/DeckDetailScreen.js",
        m_flash: "androidApp/src/screens/FlashcardScreen.js",
        m_quiz: "androidApp/src/screens/QuizScreen.js",
        m_storage: "androidApp/src/utils/storage.js",
        m_update: "androidApp/src/screens/HomeScreen.js (checkUpdates/downloadUpdate)"
      };

      const commentsByNode = [];
      [["desktop", desktop], ["mobile", mobile]].forEach(([flowKey, nodes]) => {
        nodes.forEach(n => {
          const c = state.comments[n.id];
          if (!c || !c.trim()) return;
          const incoming = allEdges[flowKey]
            .filter(e => e.to === n.id)
            .map(e => e.from);
          const outgoing = allEdges[flowKey]
            .filter(e => e.from === n.id)
            .map(e => e.to);
          commentsByNode.push({
            flow: flowKey,
            id: n.id,
            label: n.label,
            detail: n.detail,
            comment: c.trim(),
            incoming,
            outgoing,
            fileHint: nodeFileHints[n.id] || "(chưa map file)"
          });
        });
      });

      const commentedEdges = [];
      ["desktop", "mobile"].forEach(flowKey => {
        getFlowEdges(flowKey).forEach(e => {
          if (!e.label || !e.label.trim()) return;
          commentedEdges.push({
            flow: flowKey,
            id: e.id,
            from: e.from,
            to: e.to,
            label: e.label.trim(),
            arrow: e.arrow,
            bend: e.bend
          });
        });
      });

      const flowSummary = [
        "Desktop flow chính:",
        "- HomeFrame -> APIKeyDialog / ScanFrame / DeckFrame",
        "- ScanFrame -> ScanAssignDialog -> QuestionDedupDialog -> HomeFrame",
        "- DeckFrame -> StudyFrame / QuizFrame / ExportService",
        "- StudyFrame/QuizFrame lưu progress và quay về HomeFrame",
        "",
        "Mobile flow chính:",
        "- HomeScreen -> DeckDetailScreen -> FlashcardScreen hoặc QuizScreen",
        "- HomeScreen hỗ trợ import decks.json, clear deck, check update APK",
        "- FlashcardScreen và QuizScreen lưu trạng thái qua storage.js (AsyncStorage)"
      ].join("\n");

      const prompt = [
        "Bạn là senior engineer. Hãy sửa code PNGToQuizlet dựa trên các NODE đã được comment dưới đây. Không phân tích lan man toàn hệ thống.",
        "",
        "[Bối cảnh project]",
        "- Desktop: Python + CustomTkinter (app.py, services/*)",
        "- Mobile: React Native Expo (androidApp/src/screens/*, androidApp/src/utils/storage.js)",
        "",
        "[Flow hiện tại]",
        flowSummary,
        "",
        "[Mục tiêu cần sửa]",
        state.globalGoal?.trim() || "(Chưa nhập - hãy đề xuất cải tiến dựa trên comment)",
        "",
        `[Mức độ ưu tiên]: ${state.priority}`,
        "",
        "[NODE issues - phạm vi bắt buộc]",
        commentsByNode.length
          ? commentsByNode.map((it, idx) => {
              const inStr = it.incoming.length ? it.incoming.join(", ") : "(không có)";
              const outStr = it.outgoing.length ? it.outgoing.join(", ") : "(không có)";
              return [
                `Issue ${idx + 1}:`,
                `- flow: ${it.flow}`,
                `- node_id: ${it.id}`,
                `- node_label: ${it.label}`,
                `- node_detail: ${it.detail}`,
                `- incoming_nodes: ${inStr}`,
                `- outgoing_nodes: ${outStr}`,
                `- file_hint: ${it.fileHint}`,
                `- user_comment: ${it.comment}`
              ].join("\n");
            }).join("\n\n")
          : "- Chưa có comment cụ thể.",
        "",
        "[EDGE notes - chỉ tham chiếu khi cần]",
        commentedEdges.length
          ? commentedEdges.map((e, idx) => [
              `Edge ${idx + 1}:`,
              `- flow: ${e.flow}`,
              `- edge_id: ${e.id}`,
              `- from: ${e.from}`,
              `- to: ${e.to}`,
              `- label: ${e.label}`,
              `- arrow: ${e.arrow}`,
              `- bend: ${e.bend}`
            ].join("\n")).join("\n\n")
          : "- Không có ghi chú dây.",
        "",
        "[Yêu cầu output]",
        "1) Với mỗi Issue, bắt buộc trả lời theo đúng node_id tương ứng.",
        "2) Nêu root cause ngắn gọn theo từng Issue (không gộp).",
        "3) Chỉ rõ file/hàm cần sửa dựa trên file_hint, và nếu cần thì nêu thêm file phụ trợ.",
        "4) Đưa patch đề xuất (diff hoặc code thay thế) cho từng Issue.",
        "5) Đưa checklist test manual theo đúng flow của node đó.",
        "6) Nếu thiếu thông tin, hỏi đúng 1 câu hỏi làm rõ cho từng Issue bị thiếu."
      ].join("\n");

      ui.promptOut.textContent = prompt;
      return prompt;
    }

    ui.tabs.forEach(t => t.addEventListener("click", () => setFlow(t.dataset.flow)));

    ui.nodeComment.addEventListener("input", () => {
      const node = getActiveNodeObj();
      if (!node) return;
      state.comments[node.id] = ui.nodeComment.value;
      persist();
      renderFlow();
    });

    ui.edgeLabel.addEventListener("input", () => {
      const edge = getActiveEdgeObj();
      if (!edge) return;
      setEdgeMeta(state.activeFlow, edge.id, { label: ui.edgeLabel.value });
      persist();
      renderFlow();
      updateEdgePanel();
    });

    ui.arrowMode.addEventListener("change", () => {
      const edge = getActiveEdgeObj();
      if (!edge) return;
      setEdgeMeta(state.activeFlow, edge.id, { arrow: ui.arrowMode.value });
      persist();
      renderFlow();
    });

    ui.edgeBend.addEventListener("input", () => {
      const edge = getActiveEdgeObj();
      if (!edge) return;
      setEdgeMeta(state.activeFlow, edge.id, { bend: Number(ui.edgeBend.value) });
      persist();
      renderFlow();
    });

    ui.globalGoal.addEventListener("input", () => {
      state.globalGoal = ui.globalGoal.value;
      persist();
    });

    ui.priority.addEventListener("change", () => {
      state.priority = ui.priority.value;
      persist();
    });

    ui.btnBuild.addEventListener("click", () => {
      buildPrompt();
      persist();
    });

    ui.btnCopy.addEventListener("click", async () => {
      const prompt = buildPrompt();
      try {
        await navigator.clipboard.writeText(prompt);
        ui.btnCopy.textContent = "Đã copy";
        setTimeout(() => { ui.btnCopy.textContent = "Copy Prompt"; }, 1200);
      } catch {
        ui.btnCopy.textContent = "Copy lỗi";
        setTimeout(() => { ui.btnCopy.textContent = "Copy Prompt"; }, 1200);
      }
    });

    ui.btnReset.addEventListener("click", () => {
      if (!confirm("Xoá toàn bộ comment + goal đã lưu?")) return;
      state.comments = {};
      state.globalGoal = "";
      ui.globalGoal.value = "";
      ui.promptOut.textContent = "Prompt sẽ xuất hiện ở đây...";
      state.edgeMeta = {};
      persist();
      renderFlow();
      updateNodePanel();
      updateEdgePanel();
    });

    ui.btnSaveLayout.addEventListener("click", () => {
      persist();
      ui.btnSaveLayout.textContent = "Đã lưu";
      setTimeout(() => { ui.btnSaveLayout.textContent = "Lưu layout"; }, 1000);
    });

    ui.btnResetLayout.addEventListener("click", () => {
      clearFlowLayout(state.activeFlow);
      persist();
      renderFlow();
    });

    ui.btnReverseEdge.addEventListener("click", () => {
      const edge = getActiveEdgeObj();
      if (!edge) return;
      setEdgeMeta(state.activeFlow, edge.id, { from: edge.to, to: edge.from });
      persist();
      renderFlow();
      updateEdgePanel();
    });

    ui.btnClearEdgeLabel.addEventListener("click", () => {
      const edge = getActiveEdgeObj();
      if (!edge) return;
      setEdgeMeta(state.activeFlow, edge.id, { label: "" });
      persist();
      renderFlow();
      updateEdgePanel();
    });

    window.addEventListener("mousemove", (evt) => {
      if (!dragState.active || !dragState.nodeId) return;
      const flowKey = state.activeFlow;
      const node = getFlowNodes(flowKey).find(n => n.id === dragState.nodeId);
      if (!node) return;
      const p = toSvgPoint(evt);
      const vb = ui.svg.viewBox.baseVal;
      const nx = Math.max(10, Math.min(vb.width - node.w - 10, p.x - dragState.dx));
      const ny = Math.max(10, Math.min(vb.height - node.h - 10, p.y - dragState.dy));
      setNodePosition(flowKey, node.id, nx, ny);
      dragState.moved = true;
      renderFlow();
    });

    window.addEventListener("mouseup", () => {
      if (!dragState.active) return;
      dragState.active = false;
      dragState.nodeId = null;
      dragState.dx = 0;
      dragState.dy = 0;
      if (dragState.moved) persist();
      setTimeout(() => { dragState.moved = false; }, 0);
    });

    loadState();
    setFlow(state.activeFlow || "desktop");
    if (state.activeNode) updateNodePanel();
    updateEdgePanel();
  </script>
</body>
</html>
